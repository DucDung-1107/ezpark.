services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./spots.json:/spots.json          # mount spots config for backend
      - ./backend/app:/usr/src/app/app    # optional dev bind mount
    depends_on:
      - db

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: parkwave
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d parkwave -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  cv-worker:
    build:
      context: ./cv-worker
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      - backend
    volumes:
      - ./spots.json:/spots.json         # mount spots config for cv-worker
      - ./cv-worker:/usr/src/app         # optional dev bind mount

  payment-sandbox:
    build:
      context: ./payment-sandbox
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "9000:9000"
    depends_on:
      - backend

volumes:
  pgdata: